name: GrokBot Gateway Proxy
description: Reverse proxy to the GrokBot gateway over the NetBird commu mesh (atomgrok)
configuration:
  upstream_host:
    name: Upstream host
    description: NetBird mesh IP or hostname of the GrokBot gateway (default 100.64.142.60 = atomgrok.commu.oracle)
  upstream_port:
    name: Upstream port
    description: Gateway port on the GrokBot box (default 1340)
